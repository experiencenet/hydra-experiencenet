name: Runner probe
# Throwaway diagnostic. Answers one question: can this repository reach the
# organization's self-hosted runners at all, or is it only the Mac that is
# unreachable. Delete once the answer is known.
on:
  workflow_dispatch:
permissions: {}
jobs:
  on-mac:
    runs-on: [self-hosted, qt]
    steps:
      - run: echo "mac runner reachable from this repository"
  on-linux:
    runs-on: [self-hosted, linux, x64]
    steps:
      - run: echo "linux runner reachable from this repository"
